services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sds}
      POSTGRES_DB: ${POSTGRES_DB:-sds}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # `pnpm dev` runs the simulator on the host; this is the containerized one:
  # docker compose --profile simulator up -d
  simulator:
    profiles: [simulator]
    build:
      context: .
      dockerfile: apps/simulator/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  postgres-data:
  redis-data:
